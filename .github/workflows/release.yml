name: Package and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Zips
        run: |
          TAG_NAME="${{ github.ref_name }}"

          # Define exact filenames using the tag
          DATAPACK_FILE="ttu_server_${TAG_NAME}_datapack.zip"
          RESOURCE_FILE="ttu_server_${TAG_NAME}_resourcepack.zip"

          # Zip datapack
          cd datapack
          zip -r "../$DATAPACK_FILE" .
          cd ..

          # Zip resourcepack
          cd resourcepack
          zip -r "../$RESOURCE_FILE" .
          cd ..

          # Save filenames to GitHub environment so subsequent steps can use them
          echo "DATAPACK_FILE=$DATAPACK_FILE" >> $GITHUB_ENV
          echo "RESOURCE_FILE=$RESOURCE_FILE" >> $GITHUB_ENV

      # 1 & 2. Upload internal workflow pipeline artifacts explicitly
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-packs
          path: |
            ${{ env.DATAPACK_FILE }}
            ${{ env.RESOURCE_FILE }}

      # 3. Create release, auto-generate changelog, and attach the exact zips
      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.DATAPACK_FILE }}
            ${{ env.RESOURCE_FILE }}
          generate_release_notes: true
