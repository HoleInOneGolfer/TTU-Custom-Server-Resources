name: Package and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release artifacts
        run: scripts/package.sh

      - name: Export artifact file names
        run: |
          echo "DATAPACK_FILE=dist/TTU-Datapack.zip" >> "$GITHUB_ENV"
          echo "RESOURCEPACK_FILE=dist/TTU-Resourcepack.zip" >> "$GITHUB_ENV"
          echo "BUNDLE_FILE=dist/TTU-Server-Packs.zip" >> "$GITHUB_ENV"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-packs
          path: |
            ${{ env.DATAPACK_FILE }}
            ${{ env.RESOURCEPACK_FILE }}
            ${{ env.BUNDLE_FILE }}

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.DATAPACK_FILE }}
            ${{ env.RESOURCEPACK_FILE }}
            ${{ env.BUNDLE_FILE }}
          generate_release_notes: true
