name: Package and Release

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with v

jobs:
  release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Zip datapack folder with custom naming
      - name: Zip Datapack
        run: |
          TAG_NAME="${{ github.ref_name }}"
          cd datapack
          zip -r "../ttu_server_${TAG_NAME}_v*.zip" .

      # 2. Zip resourcepack folder with custom naming
      - name: Zip Resourcepack
        run: |
          TAG_NAME="${{ github.ref_name }}"
          cd resourcepack
          zip -r "../ttu_server_${TAG_NAME}_v*.zip" .

      # Upload internal workflow pipeline artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-packs
          path: ttu_server_*_v*.zip

      # 3. Create release, auto-generate changelog, and attach the custom zips
      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ttu_server_*_v*.zip
          generate_release_notes: true